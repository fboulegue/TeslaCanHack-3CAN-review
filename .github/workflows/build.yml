name: build

on:
  push:
  pull_request:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Protocol and RX-filter tests
        run: make -C test check

  waveshare-listen-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install PlatformIO
        run: python -m pip install platformio
      - name: Build Waveshare satellite
        run: pio run -d esp32 -e waveshare-remote-satellite-listenonly
