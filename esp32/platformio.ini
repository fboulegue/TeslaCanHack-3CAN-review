[platformio]
src_dir = .firmware

[env:waveshare-remote-satellite]
platform = platformio/espressif32@6.5.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_src_filter = -<*> +<satellite/main.cpp>

board_build.flash_size = 8MB
board_build.flash_mode = qio
board_build.partitions = default_8MB.csv
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608

build_flags =
    -D BOARD_WAVESHARE_S3
    -D BUILD_WAVESHARE_REMOTE_SATELLITE
    -D PIN_SAT_CAN_TX=15
    -D PIN_SAT_CAN_RX=16
    -D PIN_SAT_UART_TX=1
    -D PIN_SAT_UART_RX=2
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1

[env:waveshare-remote-satellite-listenonly]
extends = env:waveshare-remote-satellite
build_flags =
    ${env:waveshare-remote-satellite.build_flags}
    -D SATELLITE_FORCE_LISTEN_ONLY
